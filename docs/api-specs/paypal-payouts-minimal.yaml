openapi: 3.0.0
info:
  title: PayPal Payouts (Minimal)
  description: Minimal OpenAPI spec for Financial OS impact payouts.
  version: "1.0.0"
servers:
  - url: https://api-m.sandbox.paypal.com
    description: PayPal Sandbox
  - url: https://api-m.paypal.com
    description: PayPal Live
paths:
  /v1/payments/payouts:
    post:
      summary: Create batch payout
      operationId: createBatchPayout
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRequest'
      responses:
        '201':
          description: Payout batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/payments/payouts/{payout_batch_id}:
    get:
      summary: Show payout batch details
      operationId: getBatchPayout
      security:
        - OAuth2: []
      parameters:
        - name: payout_batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payout batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth2/token
          scopes:
            https://uri.paypal.com/payments/payouts: Payouts scope
  schemas:
    PayoutRequest:
      type: object
      required:
        - sender_batch_header
        - items
      properties:
        sender_batch_header:
          $ref: '#/components/schemas/SenderBatchHeader'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PayoutItem'
    SenderBatchHeader:
      type: object
      required:
        - sender_batch_id
        - email_subject
      properties:
        sender_batch_id:
          type: string
        email_subject:
          type: string
        email_message:
          type: string
    PayoutItem:
      type: object
      required:
        - recipient_type
        - amount
        - receiver
        - note
        - sender_item_id
      properties:
        recipient_type:
          type: string
          enum: [EMAIL, PHONE, PAYPAL_ID]
        amount:
          $ref: '#/components/schemas/Amount'
        receiver:
          type: string
        note:
          type: string
        sender_item_id:
          type: string
    Amount:
      type: object
      required:
        - value
        - currency
      properties:
        value:
          type: string
        currency:
          type: string
    PayoutResponse:
      type: object
      properties:
        batch_header:
          $ref: '#/components/schemas/BatchHeader'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PayoutItemDetail'
    BatchHeader:
      type: object
      properties:
        payout_batch_id:
          type: string
        batch_status:
          type: string
        sender_batch_header:
          $ref: '#/components/schemas/SenderBatchHeader'
    PayoutItemDetail:
      type: object
      properties:
        payout_item_id:
          type: string
        transaction_status:
          type: string
        payout_item_fee:
          $ref: '#/components/schemas/Amount'
        payout_batch_id:
          type: string
    Error:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        debug_id:
          type: string
        details:
          type: array
          items:
            type: object
